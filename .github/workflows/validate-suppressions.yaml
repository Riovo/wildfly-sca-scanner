name: Validate Suppressions

on:
  push:
    paths:
      - 'suppressions/**'
      - 'owasp-suppressions/**'
      - 'scripts/suppressions/**'
      - 'tests/**'
      - '.github/workflows/validate-suppressions.yaml'
  pull_request:
    paths:
      - 'suppressions/**'
      - 'owasp-suppressions/**'
      - 'scripts/suppressions/**'
      - 'tests/**'
      - '.github/workflows/validate-suppressions.yaml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/suppressions/requirements-dev.txt

      - name: Validate canonical YAML
        run: python scripts/suppressions/validate.py suppressions/suppressions.yaml

      - name: Regenerate Trivy ignore file
        run: python scripts/suppressions/convert_to_trivy.py suppressions/suppressions.yaml suppressions/.trivyignore-check.yaml

      - name: Check Trivy ignore file is up to date
        run: diff suppressions/.trivyignore.yaml suppressions/.trivyignore-check.yaml

      - name: Regenerate OWASP DC XML
        run: python scripts/suppressions/convert_to_owaspdc.py suppressions/suppressions.yaml owasp-suppressions/owasp-suppressions-check.xml

      - name: Check OWASP DC roundtrip XML is up to date
        run: diff owasp-suppressions/owasp-suppressions-roundtrip.xml owasp-suppressions/owasp-suppressions-check.xml

      - name: Check original OWASP DC XML matches canonical YAML
        run: python scripts/suppressions/check_xml_drift.py owasp-suppressions/owasp-suppressions.xml suppressions/suppressions.yaml

      - name: Run test suite
        run: python -m pytest tests/ -v
